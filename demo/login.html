<!DOCTYPE html> 
<html lang="vi"> 
<head> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập</title> <!-- Tieu de -->
  
  <link rel="stylesheet" href="login.css"> <!-- Lien ket voi file css -->
</head>
<body> 

  <div class="login-box"> <!-- Khung bao quanh -->
    
    <h2>Đăng Nhập</h2> <!-- Tieu de -->

    <form id="loginForm"> <!-- Form dang nhap -->
      
      <div class="input-group">
        <label for="username">Tên đăng nhập:</label> <!-- Ten cho o dang nhap -->
        <input type="text" id="username" placeholder="Nhập tên đăng nhập"> <!-- O dung go ten dang nhap -->
      </div>

      <div class="input-group">
        <label for="password">Mật khẩu:</label> <!-- Ten cho o nhap mat khau -->
        <input type="password" id="password" placeholder="Nhập mật khẩu"> <!-- O nhap mat khau -->
      </div>

      <button type="submit" class="btn-login">Đăng Nhập</button> <!-- Nut dang nhap -->

    </form>

    <p class="register-link">
      Chưa có tài khoản? <a href="signin.html">Đăng ký ngay</a> <!-- Tao duong dan sang signin -->
    </p>

  </div>

  <script src="login.js"></script> <!-- Lien ket voi javascript -->
</body>
</html>
