<!DOCTYPE html>
<html lang="vi"> 
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Đăng Ký Tài Khoản</title>
  
  <!-- lien ket voi css-->
  <link rel="stylesheet" href="signin.css">
</head>
<body>

  <!-- Hop chua form dang ky -->
  <div class="signin-box">
    
    <h2>Đăng Ký</h2>

    <!-- Form nhap thong tin tao tai khoan -->
    <form id="signinForm">
      
      <!-- O nhap ten dang nhap -->
      <div class="input-group">
        <label for="fullname">Tên đăng nhập:</label>
        <input type="text" id="fullname" placeholder="Nhập tên đăng nhập">
      </div>

      <!-- O nhap email -->
      <div class="input-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Nhập địa chỉ email">
      </div>

      <!-- O nhap mat khau -->
      <div class="input-group">
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)">
      </div>

      <!-- O xac nhan mat khau-->
      <div class="input-group">
        <label for="confirmPassword">Xác nhận Mật khẩu:</label>
        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
      </div>

      <!-- Nut bam dang ky -->
      <button type="submit" class="btn-signin">Tạo Tài Khoản</button>

    </form>

    <!-- Quay lai trang danh nhap -->
    <p class="login-link">
      Đã có tài khoản? <a href="../login/login.html">Đăng nhập ngay</a>
    </p>

  </div>

  <script src="signin.js"></script> <!-- Lien ket voi javascript -->
</body>
</html>
